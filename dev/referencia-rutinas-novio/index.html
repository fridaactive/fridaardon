<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Coach Seba</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first coaching console — sticky header, single column of cards, full-screen session runner with a fixed control bar. */
:root{
  --bg:#f5f4f8; --surface:#ffffff; --sunk:#ecebf2; --fg:#1d1a26; --muted:#6a6578; --line:#dfdce8;
  --accent:#6a45db; --accent-soft:#ebe5ff; --accent-ink:#ffffff;
  --rest:#0d8a76; --rest-soft:#dcf3ee;
  --good:#1d8549; --good-soft:#e1f3e8; --warn:#a86b12; --warn-soft:#fbefd9; --bad:#bf3626; --bad-soft:#fbe4e0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121019; --surface:#1b1824; --sunk:#24212f; --fg:#efedf6; --muted:#a29db2; --line:#302c3c;
  --accent:#a58cff; --accent-soft:#2c2547; --accent-ink:#140f24;
  --rest:#3cc6ac; --rest-soft:#123b34;
  --good:#52c985; --good-soft:#16321f; --warn:#e3ac52; --warn-soft:#3a2c12; --bad:#f07565; --bad-soft:#3d1c18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121019; --surface:#1b1824; --sunk:#24212f; --fg:#efedf6; --muted:#a29db2; --line:#302c3c;
  --accent:#a58cff; --accent-soft:#2c2547; --accent-ink:#140f24;
  --rest:#3cc6ac; --rest-soft:#123b34;
  --good:#52c985; --good-soft:#16321f; --warn:#e3ac52; --warn-soft:#3a2c12; --bad:#f07565; --bad-soft:#3d1c18;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px;display:flex;flex-direction:column;gap:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.brand b{color:var(--accent)}
.grow{flex:1;min-width:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:19px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn.big{min-height:60px;font-size:19px;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase;padding-inline:20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;background:var(--sunk);border-radius:10px;padding:4px;overflow-x:auto}
.tabs button{flex:1 0 auto;border:0;background:transparent;border-radius:8px;padding:8px 12px;font-weight:600;color:var(--muted);min-height:40px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.rest{background:var(--rest-soft);color:var(--rest)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.day.today{border-color:var(--accent);background:var(--accent-soft)}
.day .nm{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px}
.tblwrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-weight:400;min-height:44px;width:100%}
label.chk{display:flex;gap:8px;align-items:center;font-size:15px}
label.chk input{width:22px;height:22px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.exrow{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .grow{display:flex;flex-direction:column;gap:2px}
.exrow.retired{opacity:.55}
.exrow.retired .nm{text-decoration:line-through}
.mini{min-height:36px;padding:6px 10px;font-size:14px}
.sheet-bg{position:fixed;inset:0;background:rgb(10 8 16 / .5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;font-size:14px}
.note{border-radius:10px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:14px}

/* Runner */
.run{min-height:100%;display:flex;flex-direction:column}
.run-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.run-head .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;gap:10px;align-items:center}
.clock{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--sunk)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.run-body{max-width:760px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(130px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.exname{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,40px);line-height:1.02;text-transform:uppercase;letter-spacing:.01em}
.how{font-size:16px;color:var(--fg);background:var(--sunk);border-radius:10px;padding:10px 12px}
.timer{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.timer .ring{position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer .t .n{font-family:var(--f-display);font-weight:700;font-size:clamp(64px,20vw,96px);font-variant-numeric:tabular-nums;line-height:1}
.timer .t .u{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.run.resting .timer .t .n{color:var(--rest)}
.stepper{display:flex;align-items:center;gap:6px;background:var(--sunk);border-radius:12px;padding:6px}
.stepper button{width:48px;height:48px;border-radius:10px;border:0;background:var(--surface);font-size:24px;font-weight:700}
.stepper .v{flex:1;text-align:center;font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:56px}
.stepper .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;display:block;font-family:var(--f-body)}
.steppers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.next{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.next .k{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale.z{grid-template-columns:repeat(11,1fr)}
.scale button{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:700;font-variant-numeric:tabular-nums;padding:0}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.bar .btn.big{flex:1}
.sets{display:flex;gap:6px;flex-wrap:wrap}
.sets span{font-size:13px;font-variant-numeric:tabular-nums;border-radius:8px;padding:4px 8px;background:var(--sunk)}
.sets span.done{background:var(--good-soft);color:var(--good);font-weight:600}
.sets span.cur{background:var(--accent);color:var(--accent-ink);font-weight:600}
.steplist{display:flex;flex-direction:column}
.steplist button{text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;display:flex;gap:8px;align-items:center}
.steplist button.cur{color:var(--accent);font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.bar .btn.big.icon{flex:0 0 64px;padding-inline:0}
.sessrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:8px;border-bottom:1px solid var(--line)}
.sessrow:last-child{border-bottom:0}
.run.ending .timer .t .n{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);color:var(--bad)}}
.exrow{flex-wrap:wrap}
.exrow .ctl{display:flex;gap:4px}
.day .row .nm{min-width:0}
.alert{border-radius:10px;padding:10px 12px;background:var(--bad-soft);color:var(--bad);font-size:15px;font-weight:600}
.card.attn{border-color:var(--warn);background:var(--warn-soft)}
.notes .nline{font-size:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{text-align:center;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.cal-c{min-height:52px;border:1px solid var(--line);border-radius:8px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:4px 2px;font-variant-numeric:tabular-nums;min-width:0}
.cal-c.off{border:0;background:transparent}
.cal-c span{font-size:14px;font-weight:600}
.cal-c.today{border-color:var(--accent)}
.cal-c.today span{color:var(--accent)}
.cal-c.sel{background:var(--accent);border-color:var(--accent)}
.cal-c.sel span{color:var(--accent-ink)}
.dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;align-items:center}
.dots i,.lg{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dots i.g,.lg.g{background:var(--good)} .dots i.b,.lg.b{background:var(--bad)} .dots i.w,.lg.w{background:var(--warn)} .dots i.x{background:var(--line)}
.cal-c.sel .dots i{outline:1.5px solid var(--accent-ink)}
.dots em{font-size:10px;font-style:normal;color:var(--muted)}
.cal-m{font-family:var(--f-display);font-size:18px;text-transform:capitalize;min-width:120px;text-align:center}
.legend .lg{margin-right:5px}
.appt{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.appt .tm{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.appt .ab{display:flex;flex-direction:column;gap:10px;min-width:0}
.appt .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;line-height:1.3}
.appt .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.appt .person{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.appt .pn{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;min-height:40px;padding:0 10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.v[aria-pressed="true"]{background:var(--good-soft);color:var(--good)}
.seg button.f[aria-pressed="true"]{background:var(--bad-soft);color:var(--bad)}
.seg button.c[aria-pressed="true"]{background:var(--sunk);color:var(--fg)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.slot{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-weight:600}
.slot input[type=checkbox]{width:20px;height:20px}
.slot span{width:34px}
.slot input[type=time]{flex:1;min-width:0;border:0;background:transparent;min-height:36px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.opt input[type=radio]{width:22px;height:22px;margin-top:2px;flex:0 0 auto}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.resumed{border-radius:10px;padding:10px 12px;background:var(--accent-soft);color:var(--fg);font-size:15px}
.crash{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));z-index:80;background:var(--surface);border:2px solid var(--bad);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;color:var(--fg)}
.endbtn{margin-top:12px;align-self:stretch;border-color:var(--bad-soft)}
.sched{display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px}
.slot.on{border-color:var(--accent);background:var(--surface)}
.slot input[type=time]:disabled{opacity:.35}
.slots .slot span{width:auto;min-width:76px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.exname.sm{font-size:clamp(22px,6vw,28px)}
.lane-t{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.lane-t.over{color:var(--good)}
.timer.small-t{padding:0}
.timer.small-t .n{font-family:var(--f-display);font-weight:700;font-size:56px;font-variant-numeric:tabular-nums;line-height:1}
.timer.small-t .u{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.how-d summary{cursor:pointer;color:var(--muted);font-size:14px}
.card.pair{border-color:var(--accent)}
.solo summary{font-size:13px;color:var(--muted);cursor:pointer;margin-top:4px}
.tracker{gap:8px}
.trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:4px;border-top:1px solid var(--line)}
.tcs{display:flex;gap:4px}
.tc{display:flex;gap:2px;padding:4px;border-radius:6px;background:var(--sunk)}
.tc.curr{outline:2px solid var(--accent)}
.tc i,.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);background:transparent}
.tc i.on.a,.dot.a{background:var(--accent);border-color:var(--accent)}
.tc i.on.b,.dot.b{background:var(--rest);border-color:var(--rest)}
.dot{vertical-align:middle;margin-right:3px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.more summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
.more[open] summary{margin-bottom:8px}
.pv{display:flex;flex-direction:column;gap:2px;padding-top:6px;border-top:1px solid var(--line);font-size:15px}
.stepper .v input.sv{width:100%;border:0;background:transparent;text-align:center;font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);padding:0;min-height:40px}
.stepper .v input.sv:focus{outline:2px solid var(--accent);border-radius:8px;background:var(--surface)}
.loadbox{background:var(--sunk);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.loadbox .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;text-align:center}
.lrow{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:6px;align-items:center}
.lrow button{width:48px;height:48px;border-radius:10px;border:0;background:var(--surface);font-size:24px;font-weight:700}
.lu{display:flex;align-items:baseline;justify-content:center;gap:4px;background:var(--surface);border-radius:10px;padding:4px 6px;min-width:0;border:1.5px solid transparent}
.lu.main{border-color:var(--accent)}
.lu input.sv{width:100%;min-width:0;border:0;background:transparent;text-align:right;font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);padding:0}
.lu input.sv:focus{outline:none}
.lu span{font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}

.rlist{display:flex;flex-direction:column;gap:6px}

.rrow input[type=time]{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:40px;background:var(--surface);font-variant-numeric:tabular-nums}
.rrow .grow{min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<div id="app"></div>

<div id="toast" hidden class="toast"></div>

<div class="row"><button class="btn primary" id="crash-home">Volver al inicio</button><button class="btn" id="crash-reset">Reiniciar la app</button></div>
<div class="small">Tus sesiones quedan guardadas. Si se repite, mandale una captura de este mensaje a Claude.</div></div>

<script>
(() => {
"use strict";
/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, "0");
const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); return (h ? h + ":" + pad(m) : m) + ":" + pad(s % 60); };
const fdate = t => new Date(t).toLocaleDateString("es", { day: "numeric", month: "short" });
const fdateLong = t => new Date(t).toLocaleDateString("es", { weekday: "long", day: "numeric", month: "long" });
const avg = a => { const v = a.filter(x => typeof x === "number"); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };
const r1 = n => n == null ? "–" : (Math.round(n * 10) / 10).toString().replace(".", ",");
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

/* ---------- store ---------- */
const COLS = ["clients", "routines", "sessions", "library", "attendance"];
const data = { clients: {}, routines: {}, sessions: {}, library: {}, attendance: {} };
let DB = null, mode = "loading", canWrite = true;
const loaded = new Set();
const writeQ = {};
function persistLocal() { if (mode === "local") LS.set("liftcoach-local", data); }
async function put(col, id, obj) {
  data[col][id] = obj;
  if (mode !== "db") { persistLocal(); return; }
  const key = col + "/" + id;
  const q = writeQ[key] || (writeQ[key] = { busy: false, next: null });
  q.next = obj;
  if (q.busy) return;
  q.busy = true;
  while (q.next) {
    const body = q.next; q.next = null;
    try { await DB.doc(key).set(body); }
    catch (e) {
      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); if (!q.next) q.next = body; continue; }
      if (e && e.code === "invalid_argument") { canWrite = false; toast("No tenés permiso para guardar en esta página"); }
      else if (e && e.code === "quota_exceeded") toast("Se llenó el espacio de datos: borrá sesiones viejas");

}
async function del(col, id) {
  delete data[col][id];
  if (mode !== "db") { persistLocal(); return; }
  try { await DB.doc(col + "/" + id).delete(); } catch { toast("No se pudo borrar"); }
}
async function initStore() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) {
    mode = "local";
    const saved = LS.get("liftcoach-local");
    if (saved) COLS.forEach(c => data[c] = saved[c] || {});
    COLS.forEach(c => loaded.add(c));
    render();
    return;
  }
  DB = db; mode = "db";
  try { const u = await window.claude.use("user"); const w = u && u.can ? await u.can("data.write") : null; if (w === false) canWrite = false; } catch {}
  COLS.forEach(c => {
    DB.collection(c).onSnapshot(snap => {
      const m = {};
      snap.docs.forEach(d => { if (d.exists) m[d.id] = clone(d.data()); });
      // never clobber the session being run on this device, nor a newer local copy
      if (c === "sessions") {
        if (run && data.sessions[run.id]) m[run.id] = data.sessions[run.id];
        if (duo) duo.ids.forEach(id => { if (data.sessions[id]) m[id] = data.sessions[id]; });
        Object.keys(m).forEach(id => { const loc = data.sessions[id]; if (loc && m[id].status === "active" && newerSess(loc, m[id]) === loc) m[id] = loc; });
      }
      data[c] = m; loaded.add(c);
      // don't rebuild screens while someone is typing or training; refresh when they close
      if (!run && !sheet && ui.view !== "edit") render(); else ui.dirty = true;
    }, () => { loaded.add(c); render(); });
  });
}

/* full session time: wall clock since start, minus time away (after tapping Salir) */
function sessionMs(s) {
  if (!s) return 0;
  if (s.status === "done" && s.durationMs != null) return s.durationMs;
  const end = s.status === "done" ? (s.endedAt || Date.now()) : Date.now();
  return Math.max(0, end - (s.startedAt || end) - (s.awayMs || 0) - (s.leftAt ? end - s.leftAt : 0));
}
const durOf = s => s.durationMs != null ? s.durationMs : (s.activeMs || 0);
/* the copy with more training time wins; ties go to the most recent save */
function newerSess(a, b) {
  if (!a) return b; if (!b) return a;
  const am = a.activeMs || 0, bm = b.activeMs || 0;
  if (am !== bm) return am > bm ? a : b;
  return (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
}

/* ---------- domain ---------- */
const WD = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
function clientRoutine(cid) { return Object.entries(data.routines).find(([, r]) => r.clientId === cid) || null; }
function templates() { return Object.entries(data.routines).filter(([, r]) => !r.clientId); }
function todayDayIdx(r) { const w = new Date().getDay(); const i = r.days.findIndex(d => d.weekday === w); return i; }
function activeEx(b) { return b.ex.filter(e => !e.retired); }
function targetTxt(e) {
  const side = e.side ? " por lado" : "";
  return e.mode === "time" ? `${e.sets} × ${e.sec} s${side}` : `${e.sets} × ${repsTxt(e)} ${e.unit || "reps"}${side}`;
}
function repsAt(e, n) { return e.repsList && e.repsList[n - 1] != null ? e.repsList[n - 1] : e.reps; }
function repsTxt(e) { return e.maxReps ? "máx" : e.repsList && e.repsList.length ? e.repsList.join("·") : String(e.reps); }
function repsLbl(e, n) { return e.maxReps ? "máx" : repsAt(e, n); }
function parseReps(str) { const parts = String(str || "").split(/[.·,\-/ ]+/).map(x => parseInt(x, 10)).filter(x => x > 0); return parts; }
function findEx(plan, exId) { for (const b of plan.blocks) for (const e of b.ex) if (e.id === exId) return { b, e }; return null; }
function buildSteps(plan) {
  const st = [];

    const exs = activeEx(b); if (!exs.length) return;
    if (b.superset && exs.length > 1) {
      // biserie: A1, B1, rest, A2, B2, rest...
      const rounds = Math.max(...exs.map(e => e.sets));
      for (let r = 1; r <= rounds; r++) {
        const inRound = exs.filter(e => e.sets >= r);
        inRound.forEach(e => (e.side ? ["I", "D"] : [null]).forEach(sd => st.push({ t: "work", b: b.id, e: e.id, s: r, sd, ss: true })));
        if (r < rounds) { const nx = exs.find(e => e.sets >= r + 1) || inRound[0]; st.push({ t: "rest", b: b.id, e: nx.id, s: r, sec: b.rest || Math.max(...inRound.map(e => e.rest || 30)) }); }
      }
      exs.forEach(e => st.push({ t: "rate", b: b.id, e: e.id }));
      st.push({ t: "block", b: b.id });
      return;
    }
    exs.forEach(e => {
      const sides = e.side ? ["I", "D"] : [null];
      for (let s = 1; s <= e.sets; s++) {
        sides.forEach(sd => st.push({ t: "work", b: b.id, e: e.id, s, sd }));
        if (s < e.sets) st.push({ t: "rest", b: b.id, e: e.id, s, sec: e.rest || 30 });
      }
      st.push({ t: "rate", b: b.id, e: e.id });
    });
    st.push({ t: "block", b: b.id });
  });
  st.push({ t: "end" });
  return st;
}
function exLogs(sess, exId) { return (sess.logs && sess.logs[exId]) || null; }
function sessMetrics(sess, exId, e) {
  const L = exLogs(sess, exId); if (!L) return null;
  const sets = L.sets || [];
  const time = e ? e.mode === "time" : sets.some(s => s.sec != null && s.reps == null);
  const vol = sets.reduce((a, s) => a + (time ? (s.sec || 0) : (s.reps || 0)), 0);
  const load = Math.max(0, ...sets.map(s => s.load || 0));
  const lvls = sets.map(s => s.level).filter(x => typeof x === "number");
  const level = typeof L.level === "number" ? L.level : (lvls.length ? Math.max(...lvls) : null);
  return { vol, load, level, time, rpe: L.rpe ?? null, conf: L.conf ?? null, pain: L.pain ?? null, note: L.note || "", skipped: !!L.skipped, changedTo: L.changedTo || null, nsets: sets.length, unit: e ? (e.unit || "reps") : "reps" };
}
function compare(a, b) { // b vs a (newer vs older): 1 better, 0 same, -1 worse
  if (!a || !b) return null;
  if (a.level != null && b.level != null && a.level !== b.level) return b.level > a.level ? 1 : -1;
  if (b.load !== a.load && (a.load || b.load)) return b.load > a.load ? 1 : -1;
  if (a.vol && Math.abs(b.vol - a.vol) / a.vol > 0.05) return b.vol > a.vol ? 1 : -1;
  if (a.conf != null && b.conf != null && b.conf !== a.conf) return b.conf > a.conf ? 1 : -1;

}
function metricTxt(m) {
  if (!m) return "–";
  if (m.skipped) return "No se hizo";
  let t = m.time ? `${m.vol} s` : `${m.vol} ${m.unit}`;
  if (m.load) t += ` · ${r1(m.load)} ${U()}`;
  if (m.level != null) t += ` · N${m.level}`;
  return t;
}
function trendPill(c, m) {
  if (m && m.changedTo) return `<span class="pill warn">Cambiado</span>`;
  if (m && m.skipped) return `<span class="pill bad">Desistido</span>`;
  if (c == null) return `<span class="pill">Sin dato</span>`;

}
function lastSetValue(cid, exId, field) {
  const ss = Object.values(data.sessions).filter(s => s.clientId === cid && s.logs && s.logs[exId]).sort((a, b) => b.startedAt - a.startedAt);
  for (const s of ss) { const sets = s.logs[exId].sets || []; for (let i = sets.length - 1; i >= 0; i--) if (sets[i][field] != null) return sets[i][field]; }
  return null;
}

/* ---------- sound & vibration ---------- */
const settings = Object.assign({ sound: true, vibrate: true, unit: "lb" }, LS.get("coachseba-settings") || {});

let actx = null;
function audioUnlock() {
  if (!settings.sound) return;
  try { if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (actx && actx.state === "suspended") actx.resume(); } catch { actx = null; }
}
function tone(freq, dur, at = 0, vol = 0.3) {

function cue(kind) {
  try {
    if (settings.sound && actx) {

      else if (kind === "end") { tone(660, 0.16); tone(990, 0.3, 0.2); }
      else { tone(740, 0.16); tone(740, 0.16, 0.26); tone(988, 0.35, 0.52); }
    }

  } catch {}
}

/* ---------- exercise history, pain alerts, level-up ---------- */
function exHistory(cid, e, skipId) {
  return Object.entries(data.sessions).filter(([id, s]) => id !== skipId && s.clientId === cid && s.logs).map(([, s]) => {
    let L = s.logs[e.id];
    if (!L) { const k = Object.keys(s.logs).find(k => { const x = findEx(s.plan, k); return x && x.e.name === e.name; }); L = k ? s.logs[k] : null; }
    return L ? { at: s.startedAt, L } : null;
  }).filter(Boolean).sort((a, b) => b.at - a.at);
}
function painAlert(hist) { return hist.slice(0, 2).find(h => (h.L.pain || 0) >= 4) || null; }
function clientPainAlerts(cid) {
  const last = Object.values(data.sessions).filter(s => s.clientId === cid && s.status === "done").sort((a, b) => b.startedAt - a.startedAt)[0];
  if (!last) return [];
  return Object.entries(last.logs || {}).filter(([, l]) => (l.pain || 0) >= 4).map(([k, l]) => { const f = findEx(last.plan, k); return { name: f ? f.e.name : k, pain: l.pain }; });
}
function findInRoutine(r, dayId, exId) { const d = r.days.find(x => x.id === dayId); if (!d) return null; for (const b of d.blocks) { const i = b.ex.findIndex(e => e.id === exId); if (i >= 0) return { b, i, e: b.ex[i] }; } return null; }
function goodRun(L, e) {
  if (!L || L.skipped || L.changedTo) return false;
  const sets = L.sets || []; if (sets.length < e.sets * (e.side ? 2 : 1)) return false;
  if (e.mode === "time" ? sets.some(x => (x.sec ?? 0) < e.sec) : sets.some(x => !e.maxReps && (x.reps ?? 0) < repsAt(e, x.s))) return false;
  if ((L.conf ?? 0) < 7 || (L.pain ?? 0) > 2 || (L.rpe != null && L.rpe > 7)) return false;
  return true;
}
function levelUpDue(sess, exId) {
  const f = findEx(sess.plan, exId); const r = data.routines[sess.routineId]; if (!f || !r) return false;
  const ri = findInRoutine(r, sess.dayId, exId); if (!ri || ri.e.retired) return false;
  if (!goodRun(sess.logs[exId], f.e)) return false;
  const prev = Object.values(data.sessions).filter(s => s !== sess && s.clientId === sess.clientId && s.status === "done" && s.logs && s.logs[exId] && s.startedAt < sess.startedAt).sort((a, b) => b.startedAt - a.startedAt)[0];
  if (!prev || !goodRun(prev.logs[exId], f.e)) return false;

function quickOptions(e) {
  const o = [];
  if (e.level != null) o.push({ kind: "patch", label: `${e.name} · nivel ${e.level + 1}`, how: "Mismo ejercicio, un nivel más de dificultad.", patch: { level: e.level + 1 } });
  if (e.mode === "time") o.push({ kind: "patch", label: `${e.name} · ${e.sec + 5} s por serie`, how: "Mismo ejercicio, 5 segundos más por serie.", patch: { sec: e.sec + 5 } });
  else o.push({ kind: "patch", label: `${e.name} · ${e.reps + 2} ${e.unit || "reps"}`, how: "Mismo ejercicio, 2 repeticiones más por serie.", patch: e.repsList ? { repsList: e.repsList.map(x => x + 2), reps: e.reps + 2 } : { reps: e.reps + 2 } });
  o.push({ kind: "patch", label: `${e.name} · ${e.sets + 1} series`, how: "Mismo ejercicio, una serie más.", patch: { sets: e.sets + 1 } });
  return o.slice(0, 3);
}

/* ---------- agenda ---------- */
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const MONTHS = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
function apptsFor(ds) {
  const d = new Date(ds + "T12:00:00"); const wd = d.getDay(); const out = []; const seen = new Set();
  const add = (cid, time, extra) => { const key = cid + "_" + ds + "_" + time.replace(":", ""); if (seen.has(key)) return; seen.add(key); out.push({ cid, time, date: ds, key, extra: !!extra }); };
  Object.entries(data.clients).forEach(([cid, c]) => {
    if (c.createdAt && ds < ymd(new Date(c.createdAt))) return;
    (c.slots || []).forEach(sl => { if (sl.wd === wd && sl.time) add(cid, sl.time, false); });
  });
  Object.values(data.attendance).forEach(a => { if (a.extra && a.date === ds && data.clients[a.cid]) add(a.cid, a.time, true); });
  out.forEach(o => {
    const a = data.attendance[o.key]; o.status = a && a.status || null; o.reason = a && a.reason || ""; o.note = a && a.note || ""; o.makeup = a && a.makeup || null;
    if (o.status === "reprogramado" && o.note) o.reason = o.note.replace(/^Pasa al /, "→ ");
    const pz = (data.clients[o.cid] || {}).pause;
    if (!o.status && pz && pz.from <= ds && ds < pz.until) { o.status = "pausa"; o.reason = pz.reason || "Ausente"; }
    if (!o.status && Object.values(data.sessions).some(s => s.clientId === o.cid && ymd(new Date(s.startedAt)) === ds && sessFits(s, o))) o.status = "vino";

function apptDayIdx(o, r) { if (o.makeup) { const i = r.days.findIndex(x => x.weekday === o.makeup.wd); if (i >= 0) return i; } return todayDayIdx(r); }
function apptPast(o) { const now = new Date(); const t = new Date(o.date + "T" + o.time + ":00"); return t <= now; }
function pendingNow() { return apptsFor(ymd(new Date())).filter(o => !o.status && apptPast(o)); }
function monthAttendance(cid, ref) {
  const y = ref.getFullYear(), m = ref.getMonth(); const days = new Date(y, m + 1, 0).getDate(); let exp = 0, came = 0;
  for (let i = 1; i <= days; i++) { apptsFor(ymd(new Date(y, m, i))).forEach(o => { if (o.cid !== cid || NOCOUNT(o.status) || !apptPast(o)) return; exp++; if (o.status === "vino") came++; }); }

}
const ST = { vino: ["good", "Vino"], falto: ["bad", "No vino"], cancelado: ["", "Canceló"], pausa: ["", "Ausente"], reprogramado: ["", "Reprogramado"], sinclase: ["", "Sin clase"] };
const REASONS = ["Viaje", "Enfermo", "Trabajo", "Lesión", "Sin aviso", "Otro"];

/* which routine weekday an appointment trains: the missed day for a make-up, else its own day */

  if (o.status && ST[o.status]) return `<span class="pill ${ST[o.status][0]}">${o.status === "pausa" ? esc(o.reason) : ST[o.status][1]}${o.reason && o.status !== "pausa" ? " · " + esc(o.reason) : ""}</span>`;

/* ---------- ui state ---------- */
const ui = { view: "home", client: null, tab: "dias", statsDay: 0, editDay: 0, editDraft: null, editRid: null };
let run = null; // {id, steps, running, lastTs, draft, rate}
let sheet = null;

/* ---------- render: shell ---------- */
function header(title, back) {
  return `<header class="top"><div class="in">
    ${back ? `<button class="btn ghost mini" data-act="${back}" aria-label="Volver">← Volver</button>` : `<div class="brand">Coach <b>Seba</b></div>`}
    <div class="grow"></div>
    ${title ? `<div class="eyebrow">${esc(title)}</div>` : ""}
    <button class="btn ghost mini" data-act="settings" aria-label="Ajustes">Ajustes · ${U()}</button>
  </div></header>`;
}
function render() {
  const app = $("#app");
  if (run) { renderRun(); return; }

  if (!COLS.every(c => loaded.has(c))) { app.innerHTML = header() + `<main class="wrap"><div class="card empty">Cargando clientes y rutinas…</div></main>`; return; }

  ui.dirty = false;
}

const DS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
function fmtSlots(slots) {
  const byTime = {}; (slots || []).forEach(sl => { (byTime[sl.time] = byTime[sl.time] || []).push(sl.wd); });
  return Object.entries(byTime).sort((a, b) => a[0].localeCompare(b[0])).map(([t, wds]) => {
    const o = wds.map(w => (w + 6) % 7).sort((a, b) => a - b); const consec = o.length >= 3 && o.every((v, i) => i === 0 || v === o[i - 1] + 1);
    const names = o.map(i => DS[(i + 1) % 7]);
    return (consec ? names[0] + " a " + names[names.length - 1] : names.join(", ")) + " " + t;
  }).join(" · ");
}
/* when this client is training now (active session, or up to 60 min after the slot) or comes next */
function nextAppt(cid) {
  const c = data.clients[cid]; if (!c) return Infinity;
  const now = Date.now(); let best = Infinity;
  Object.values(data.attendance).forEach(a => { if (!a.extra || a.cid !== cid || a.status) return; const t = new Date(a.date + "T" + a.time + ":00").getTime(); if (t + 60 * 60000 >= now) best = Math.min(best, t); });
  const act = Object.values(data.sessions).find(x => x.status === "active" && x.clientId === cid && now - x.startedAt < 3 * 3600000);
  if (act) return act.startedAt;
  for (let d = 0; d < 60; d++) {
    const day = new Date(); day.setHours(0, 0, 0, 0); day.setDate(day.getDate() + d);
    if (c.pause && c.pause.from <= ymd(day) && ymd(day) < c.pause.until) continue;
    (c.slots || []).forEach(sl => { if (sl.wd !== day.getDay() || !sl.time) return; const ak = data.attendance[cid + "_" + ymd(day) + "_" + sl.time.replace(":", "")]; if (ak && BLOCKED(ak.status)) return; const [h, m] = sl.time.split(":").map(Number); const t = new Date(day); t.setHours(h, m, 0, 0); if (t.getTime() + 60 * 60000 < now) return; best = Math.min(best, t.getTime()); });
    if (best < Infinity && best < day.getTime() + 86400000) break;
  }
  return best;
}
function pauseInfo(cid) { const c = data.clients[cid]; const pz = c && c.pause; const today = ymd(new Date()); return pz && today < pz.until ? pz : null; }
function fmtD(ds) { const d = new Date(ds + "T12:00:00"); return DS[d.getDay()].toLowerCase() + " " + d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3); }
function nextPill(cid) {
  const pz = pauseInfo(cid); if (pz) return `<span class="pill">${esc(pz.reason)} · vuelve ${esc(fmtD(pz.until))}</span>`;
  const t = nextAppt(cid); if (t === Infinity) return "";
  const now = Date.now(); const d = new Date(t); const hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
  const dayDiff = Math.round((new Date(d).setHours(0, 0, 0, 0) - new Date().setHours(0, 0, 0, 0)) / 86400000);
  if (t <= now) return `<span class="pill good">● Ahora · ${hm}</span>`;
  if (t - now < 60 * 60000) return `<span class="pill warn">En ${Math.max(1, Math.round((t - now) / 60000))} min · ${hm}</span>`;
  return `<span class="pill ${dayDiff === 0 ? "acc" : ""}">${dayDiff === 0 ? "Hoy" : dayDiff === 1 ? "Mañana" : DS[d.getDay()]} ${hm}</span>`;
}
function renderPairCard(a, b) {

    <div class="row"><button class="btn mini" data-act="openClient" data-id="${a}">Progreso ${esc(ca.name.split(" ")[0])}</button><button class="btn mini" data-act="openClient" data-id="${b}">Progreso ${esc(cb.name.split(" ")[0])}</button></div>

  return h + `</section>`;
}

    let n = 0;
    picks.forEach(({ g, t }) => g.members.forEach(m => {
      const wd = m.makeup ? m.makeup.wd : new Date(ctx.date + "T12:00:00").getDay();
      const old = data.attendance[m.key] || { cid: m.cid, date: ctx.date, time: g.time };
      put("attendance", m.key, Object.assign({}, old, { status: "reprogramado", reason, note: "Pasa al " + fmtD(nd) + " " + t, at: Date.now() }));
      const nk = m.cid + "_" + nd + "_" + t.replace(":", "");
      put("attendance", nk, { cid: m.cid, date: nd, time: t, extra: true, makeup: { from: ctx.date, wd, reason } }); n++;
    }));
    skips.forEach(({ g }) => g.members.forEach(m => {
      const old = data.attendance[m.key] || { cid: m.cid, date: ctx.date, time: g.time };
      put("attendance", m.key, Object.assign({}, old, { status: "sinclase", reason, note: "Sin reposición", at: Date.now() }));
    }));
    sheet = null; renderSheet(); ui.calDay = picks.length ? nd : ctx.date; render();
    toast(picks.length ? `${n} turnos reprogramados al ${fmtD(nd)}${skips.length ? " · " + skips.length + " sin reposición" : ""}` : "Día marcado sin clase");
  },
  moveAppt(t) { openSheet("moveAppt", { keys: t.dataset.keys.split(",") }); },
  saveMove() {
    const ctx = sheet.ctx; const d = $("#mv-d").value, tm = $("#mv-t").value; if (!d || !tm) { ctx.err = "Elegí día y hora."; renderSheet(); return; }
    const wd = new Date(d + "T12:00:00").getDay(); const clash = [];
    ctx.keys.forEach(k2 => { const a = data.attendance[k2]; if (!a) return; const nk = a.cid + "_" + d + "_" + tm.replace(":", ""); const c = data.clients[a.cid];
      if (nk !== k2 && (data.attendance[nk] || (c.slots || []).some(sl => sl.wd === wd && sl.time === tm))) clash.push(`${c.name} ya tiene turno ese día a las ${tm}`); });
    if (clash.length) { ctx.err = clash.join(" · ") + "."; renderSheet(); return; }
    ctx.keys.forEach(k2 => { const a = data.attendance[k2]; if (!a) return; const nk = a.cid + "_" + d + "_" + tm.replace(":", ""); if (nk === k2) return;
      put("attendance", nk, Object.assign({}, a, { date: d, time: tm })); del("attendance", k2);
      if (a.makeup && a.makeup.from) { const ok = Object.keys(data.attendance).find(x => x.startsWith(a.cid + "_" + a.makeup.from + "_") && data.attendance[x].status === "reprogramado"); if (ok) put("attendance", ok, Object.assign({}, data.attendance[ok], { note: "Pasa al " + fmtD(d) + " " + tm })); } });
    sheet = null; renderSheet(); ui.calDay = d; render(); toast("Turno movido");
  },
  askRmAppt() { sheet.ctx.confirm = true; renderSheet(); },
  rmAppt() { sheet.ctx.keys.forEach(k2 => del("attendance", k2)); sheet = null; renderSheet(); render(); toast("Turno quitado"); },
  saveAbsence() {
    const { key, cid, date, time, st } = sheet.ctx; const reason = (document.querySelector('input[name="ab-r"]:checked') || {}).value || "";
    const note = $("#ab-note").value.trim();
    let fullNote = note;
    if ($("#ab-mk").checked) {
      const md = $("#ab-mk-d").value, mt = $("#ab-mk-t").value; if (!md || !mt) { toast("Elegí día y hora para recuperar"); return; }
      const wd = new Date(date + "T12:00:00").getDay(); const mkey = cid + "_" + md + "_" + mt.replace(":", "");
      put("attendance", mkey, Object.assign({}, data.attendance[mkey] || {}, { cid, date: md, time: mt, extra: true, makeup: { from: date, wd } }));
      fullNote = (note ? note + " · " : "") + "Recupera el " + fmtD(md) + " " + mt;
    }
    put("attendance", key, Object.assign({}, data.attendance[key] || { cid, date, time }, { status: st, reason, note: fullNote, at: Date.now() }));
    if ($("#ab-multi").checked) {
      const until = $("#ab-until").value; if (!until || until <= date) { toast("Elegí el día que vuelve"); return; }
      const next = new Date(date + "T12:00:00"); next.setDate(next.getDate() + 1);
      put("clients", cid, Object.assign({}, data.clients[cid], { pause: { from: ymd(next), until, reason: reason || "Ausente", note } }));
      toast(`${data.clients[cid].name}: ausente hasta el ${fmtD(until)}`);
    } else toast("Guardado");
    closeSheet(); render();
  },
  endPause(t) { const c = Object.assign({}, data.clients[t.dataset.id]); delete c.pause; put("clients", t.dataset.id, c); render(); toast("Pausa terminada"); },
  newAppt(t) { openSheet("newAppt", { d: t.dataset.d }); },
  saveAppt() {
    const cid = $("#ap-c").value, time = $("#ap-t").value, date = sheet.ctx.d; if (!time) { toast("Poné la hora"); return; }
    const key = cid + "_" + date + "_" + time.replace(":", "");
    put("attendance", key, Object.assign({}, data.attendance[key] || {}, { cid, date, time, extra: true }));
    closeSheet(); render(); toast("Turno agregado");
  },
  library() { ui.view = "library"; render(); },
  libEdit(t) { openSheet("libEdit", { id: t.dataset.id || null }); },
  saveLib() { const ne = readExForm({}); if (!ne) return; const id = sheet.ctx.id || uid(); put("library", id, libFrom(ne)); closeSheet(); render(); toast("Ejercicio guardado"); },
  askRmLib() { sheet.ctx.confirm = true; renderSheet(); },
  async rmLib() { const id = sheet.ctx.id; sheet = null; renderSheet(); await del("library", id); render(); toast("Quitado de la biblioteca"); },
  lvlApply() {
    const ctx = sheet.ctx; const pick = (document.querySelector('input[name="lvl"]:checked') || {}).value;
    if (pick == null) { toast("Elegí una opción"); return; }
    const s = data.sessions[ctx.sid]; const r = clone(data.routines[s.routineId]); const ri = findInRoutine(r, s.dayId, ctx.exId); const old = ri.e;
    let to, desc;
    if (pick === "custom") {
      const name = $("#lvl-name").value.trim(); if (!name) { toast("Escribí el nombre del ejercicio"); return; }
      to = Object.assign({}, old, { id: uid(), name, how: $("#lvl-how").value.trim() || old.how, level: old.level != null ? old.level + 1 : null }); delete to.lvlDeclinedAt; desc = name;
    } else {
      const o = ctx.options[+pick];
      if (o.kind === "patch") { Object.assign(old, o.patch); delete old.lvlDeclinedAt; desc = o.label; }
      else { to = Object.assign({}, old, { id: uid(), name: o.name, how: o.how, mode: o.mode, sets: o.sets, reps: o.reps, sec: o.sec, side: o.side, unit: o.unit || old.unit, level: old.level != null ? old.level + 1 : null }); delete to.lvlDeclinedAt; desc = o.name; }
    }
    if (to) { old.retired = true; old.retiredAt = Date.now(); old.replacedBy = to.id; ri.b.ex.splice(ri.i + 1, 0, to); }
    r.changes = r.changes || []; r.changes.push({ at: Date.now(), dayId: s.dayId, dayName: s.dayName, fromId: ctx.exId, from: findEx(s.plan, ctx.exId).e.name, toId: to ? to.id : ctx.exId, to: desc, reason: "Subida de nivel" });
    r.updatedAt = Date.now(); put("routines", s.routineId, r);
    sheet = null; renderSheet(); toast("Nivel subido: se aplica la próxima sesión"); (ctx.done || next)();
  },
  lvlDecline() {
    const ctx = sheet.ctx; const s = data.sessions[ctx.sid]; const r = clone(data.routines[s.routineId]); const ri = findInRoutine(r, s.dayId, ctx.exId);
    if (ri) { ri.e.lvlDeclinedAt = Date.now(); r.updatedAt = Date.now(); put("routines", s.routineId, r); }
    sheet = null; renderSheet(); (ctx.done || next)();
  },
  askDelActive(t) { openSheet("delActive", { id: t.dataset.id }); },
  async doDelActive() { const id = sheet.ctx.id; const sd = data.sessions[id]; if (sd && sd.duo && data.sessions[sd.duo.with]) { LS.del("liftcoach-run-" + sd.duo.with); await del("sessions", sd.duo.with); LS.del("coachseba-open-duo"); } sheet = null; renderSheet(); LS.del("liftcoach-run-" + id); if (LS.get("coachseba-open-run") === id) LS.del("coachseba-open-run"); await del("sessions", id); render(); toast("Sesión eliminada"); },
  delSessRow(t) { openSheet("viewSess", { id: t.dataset.id, confirm: true }); },
  wipe() { openSheet("wipe"); },
  async doWipe() {
    sheet = null; renderSheet();
    for (const [sid, s] of Object.entries(data.sessions)) if (s.clientId === ui.client) { LS.del("liftcoach-run-" + sid); await del("sessions", sid); }
    render(); toast("Historial borrado");
  },
  dayText() { syncEditorFields(); openSheet("dayText"); },
  toggleDetailed() { syncEditorFields(); ui.edDetailed = !ui.edDetailed; render(); },
  saveDayText() {
    const txt = $("#dt-text").value; const r = ui.editDraft; const d = r.days[Math.min(ui.editDay, r.days.length - 1)];
    const blocks = textToBlocks(txt, d); if (!blocks.some(b => activeEx(b).length)) { toast("No encontré ejercicios: escribí uno por línea"); return; }
    d.blocks = blocks; r.updatedAt = Date.now(); put("routines", ui.editRid, clone(r));
    sheet = null; renderSheet(); render(); toast("Rutina guardada: " + blocks.reduce((a, b) => a + activeEx(b).length, 0) + " ejercicios");
  },
  editDay(t) { syncEditorFields(); ui.editDay = +t.dataset.i; render(); },
  addDay() { syncEditorFields(); ui.editDraft.days.push({ id: uid(), name: "Nuevo día", focus: "", weekday: 2, blocks: [{ id: uid(), name: "Bloque 1", ex: [] }] }); ui.editDay = ui.editDraft.days.length - 1; render(); },
  addBlock() { syncEditorFields(); const d = ui.editDraft.days[ui.editDay]; d.blocks.push({ id: uid(), name: "Nuevo bloque", ex: [] }); render(); },
  rmBlock(t) { syncEditorFields(); ui.editDraft.days[ui.editDay].blocks.splice(+t.dataset.bi, 1); render(); },
  mvBlock(t) { syncEditorFields(); const bl = ui.editDraft.days[ui.editDay].blocks; const i = +t.dataset.bi, j = i + +t.dataset.dir; if (j < 0 || j >= bl.length) return; [bl[i], bl[j]] = [bl[j], bl[i]]; render(); },
  mvEx(t) {
    syncEditorFields(); const ex = ui.editDraft.days[ui.editDay].blocks[+t.dataset.bi].ex; const i = +t.dataset.ei; const dir = +t.dataset.dir;
    let j = i + dir; while (j >= 0 && j < ex.length && ex[j].retired) j += dir; if (j < 0 || j >= ex.length) return; [ex[i], ex[j]] = [ex[j], ex[i]]; render();
  },
  exEdit(t) { syncEditorFields(); openSheet("exEdit", { bi: +t.dataset.bi, ei: +t.dataset.ei }); },
  saveEx() {
    const { bi, ei } = sheet.ctx; const d = ui.editDraft.days[ui.editDay]; const ex = d.blocks[bi].ex;
    const base = ei >= 0 ? ex[ei] : null; const ne = readExForm(base); if (!ne) return;
    maybeSaveLib(ne);
    if (ei >= 0) ex[ei] = ne; else ex.push(ne); closeSheet(); render();
  },
  rmEx() { const { bi, ei } = sheet.ctx; const e = ui.editDraft.days[ui.editDay].blocks[bi].ex[ei]; e.retired = true; e.retiredAt = Date.now(); closeSheet(); render(); },
  saveEdit() { if (sheet) { sheet = null; renderSheet(); } else syncEditorFields(); const r = ui.editDraft; r.updatedAt = Date.now(); put("routines", ui.editRid, clone(r)); ui.editDraft = null; ui.view = "client"; ui.tab = "rutina"; render(); toast("Rutina guardada"); },
  // runner
  startDuo(t) { if (run || duo || t.disabled) return; t.disabled = true; startDuo(t.dataset.cid, +t.dataset.di); },
  start(t) {
    if (run || duo || t.disabled) return; t.disabled = true;
    const d = data.routines[t.dataset.rid].days[+t.dataset.di];
    const act = Object.entries(data.sessions).find(([, s]) => s.status === "active" && s.clientId === t.dataset.cid && s.dayId === d.id);
    if (act) openRun(act[0]); else startSession(t.dataset.cid, t.dataset.rid, +t.dataset.di);
  },
  resume(t) { const s = data.sessions[t.dataset.id]; if (s && s.duo) resumeDuo(t.dataset.id); else openRun(t.dataset.id); },
  play() { run.resumed = false; run.running = !run.running; run.lastTs = performance.now(); if (!run.running) saveRun(); else wake(true); renderRun(); },
  next() { next(); },
  prev() { prev(); },
  addRest() { const st = cur(); st.sec += 15; renderRun(); },
  doneSet() { run.running = false; completeSet(false); },
  step(t) {
    const k = t.dataset.k, d = +t.dataset.d; let v = (run.draft[k] ?? 0) + d;
    if (k === "load") v = Math.max(0, Math.round(v * 10) / 10); else v = Math.max(k === "level" ? 1 : 0, v);
    run.draft[k] = v; renderRun();
  },
  scale(t) { if (duo) { duo.rate.note = ($("#rate-note") || {}).value || duo.rate.note; duo.rate[t.dataset.k] = +t.dataset.v; renderDuo(); return; } run.rate[t.dataset.k] = +t.dataset.v; renderRun(); },
  saveRate() {
    const s = S(), st = cur(); const L = s.logs[st.e] || (s.logs[st.e] = { sets: [] });
    Object.assign(L, { rpe: run.rate.rpe, conf: run.rate.conf, pain: run.rate.pain, note: ($("#rate-note") || {}).value || "" });
    saveRun();
    if (levelUpDue(s, st.e)) { openLevelUp(st.e, run.id, next); return; }
    next();
  },
  saveBlock() { const s = S(), st = cur(); s.blocks[st.b] = { score: run.rate.score, note: ($("#rate-note") || {}).value || "" }; next(); },
  finish() {
    const s = S(); s.score = run.rate.score; s.note = ($("#rate-note") || {}).value || ""; s.durationMs = sessionMs(s); s.status = "done"; s.endedAt = Date.now();
    saveRun(); LS.del("liftcoach-run-" + run.id); LS.del("coachseba-open-run"); const cid = s.clientId; run = null; wake(false);
    ui.view = "client"; ui.client = cid; ui.tab = "dias"; render(); toast("Sesión guardada");
  },
  steps() { openSheet("steps"); },
  finishEarly() { run.running = false; saveRun(); openSheet("finishEarly"); renderRun(); },
  goEnd() { sheet = null; renderSheet(); S().endedEarly = true; enterStep(run.steps.length - 1); },
  finishNow() {
    sheet = null; renderSheet();
    const s = S(); s.endedEarly = true; s.durationMs = sessionMs(s); s.status = "done"; s.endedAt = Date.now();
    saveRun(); LS.del("liftcoach-run-" + run.id); LS.del("coachseba-open-run"); const cid = s.clientId; run = null; wake(false);
    ui.view = "client"; ui.client = cid; ui.tab = "dias"; render(); toast("Sesión terminada y guardada");
  },
  jump(t) { closeSheet(); run.running = false; enterStep(+t.dataset.i); },
  leaveRun() { run.running = false; saveRun(); openSheet("leave", {}); renderRun(); },
  doLeave() { closeSheet(); S().leftAt = Date.now(); saveRun(); LS.del("coachseba-open-run"); run = null; wake(false); ui.view = "home"; render(); },
  askDiscard() { sheet.ctx.confirm = true; renderSheet(); },
  async doDiscard() { const id = run.id; closeSheet(); run = null; wake(false); LS.del("liftcoach-run-" + id); LS.del("coachseba-open-run"); await del("sessions", id); ui.view = "home"; render(); toast("Sesión descartada"); },
  changeEx() { run.running = false; openSheet("change"); },
  doChange() {
    const s = S(), st = cur(); const f = findEx(s.plan, st.e); const old = f.e;
    const ne = readExForm({ id: uid() }); if (!ne) return;
    maybeSaveLib(ne);
    const reason = $("#ch-reason").value + ($("#ch-detail").value.trim() ? ": " + $("#ch-detail").value.trim() : "");
    const apply = $("#ch-apply").checked;
    // session: retire old, insert new after it
    const L = s.logs[old.id] || (s.logs[old.id] = { sets: [] }); L.changedTo = ne.name; L.changeReason = reason;
    old.retired = true; const bi = f.b.ex.indexOf(old); f.b.ex.splice(bi + 1, 0, clone(ne));
    // routine
    if (apply && data.routines[s.routineId]) {
      const r = clone(data.routines[s.routineId]); const d = r.days.find(x => x.id === s.dayId);
      if (d) for (const b of d.blocks) { const i = b.ex.findIndex(x => x.id === old.id); if (i >= 0) { b.ex[i].retired = true; b.ex[i].retiredAt = Date.now(); b.ex[i].replacedBy = ne.id; b.ex.splice(i + 1, 0, clone(ne)); break; } }
      r.changes = r.changes || []; r.changes.push({ at: Date.now(), dayId: s.dayId, dayName: s.dayName, fromId: old.id, from: old.name, toId: ne.id, to: ne.name, reason });
      r.updatedAt = Date.now(); put("routines", s.routineId, r);
    }
    run.steps = buildSteps(s.plan);
    const idx = run.steps.findIndex(x => x.t === "work" && x.e === ne.id);
    closeSheet(); enterStep(idx >= 0 ? idx : s.stepIdx); toast("Ejercicio cambiado");
  },
  skipEx() { run.running = false; openSheet("skip"); },
  doSkip() {
    const s = S(), st = cur(); const L = s.logs[st.e] || (s.logs[st.e] = { sets: [] }); L.skipped = true; L.skipReason = $("#sk-reason").value;
    const ri = run.steps.findIndex((x, i) => i > s.stepIdx && x.t === "rate" && x.e === st.e);
    closeSheet(); enterStep(ri >= 0 ? ri + 1 : s.stepIdx + 1);
  }
};

function showCrash(msg) { const c = $("#crash"); if (!c) return; $("#crash-msg").textContent = String(msg || "").slice(0, 300); c.hidden = false; }
window.addEventListener("error", e => showCrash(e.message + (e.lineno ? " (línea " + e.lineno + ")" : "")));
window.addEventListener("unhandledrejection", e => { const r = e.reason; if (r && r.code && !r.stack) return; showCrash((r && r.message) || r); });
$("#crash-home").addEventListener("click", () => { $("#crash").hidden = true; try { if (run) saveRun(); } catch {} run = null; duo = null; sheet = null; LS.del("coachseba-open-run"); LS.del("coachseba-open-duo"); renderSheet(); ui.view = "home"; render(); });
$("#crash-reset").addEventListener("click", () => { LS.del("coachseba-open-run"); location.reload(); });

render();
initStore();
requestAnimationFrame(tick);
setInterval(() => { if (COLS.every(c => loaded.has(c))) checkAppts(); }, 20000);
(function reopen() {
  if (!COLS.every(c => loaded.has(c))) return setTimeout(reopen, 300);
  const dids = LS.get("coachseba-open-duo");
  if (!run && !duo && Array.isArray(dids)) {
    try { if (dids.every(x => data.sessions[x] && data.sessions[x].status === "active")) { openDuo(dids); return; } LS.del("coachseba-open-duo"); }
    catch (e) { LS.del("coachseba-open-duo"); duo = null; render(); showCrash(e.message); return; }
  }
  const id = LS.get("coachseba-open-run");
  if (!run && id) {
    const mirror = LS.get("liftcoach-run-" + id);
    if (!data.sessions[id] && mirror && mirror.plan && mirror.status === "active") data.sessions[id] = mirror;
    try { if (data.sessions[id] && data.sessions[id].status === "active") openRun(id); else LS.del("coachseba-open-run"); }
    catch (e) { LS.del("coachseba-open-run"); run = null; render(); showCrash(e.message); }
  }
})();
setTimeout(() => { if (COLS.every(c => loaded.has(c))) checkAppts(); }, 4000);
})();
</script>
